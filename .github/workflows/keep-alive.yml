name: Keep Render Backend Active

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Backend Health Check
        run: |
          echo "Pinging backend at $(date)"
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" https://cgjbcsc.onrender.com/admin  )
          status=$(echo "$response" | grep "HTTP_STATUS" | cut -d: -f2)
          
          if [ "$status" = "200" ]; then
            echo "✓ Backend is active (HTTP $status)"
          else
            echo "✗ Backend returned HTTP $status"
            exit 1
          fi
